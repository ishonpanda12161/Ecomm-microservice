#Spring
spring:
  application:
    name: EurekaServer

#Eureka
eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
    renewal-percent-threshold: 0.85

#Logging
logging:
  level:
    root: INFO
  file:
    name: Logs/${spring.application.name}.log

#Server
server:
  port: 8761
