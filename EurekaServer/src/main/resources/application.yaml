#Spring
spring:
  application:
    name: EurekaServer

#Eureka
eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
    renewal-percent-threshold: 0.85

#Logging
logging:
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n'
  level:
    root: WARN
  file:
    name: /workspace/Logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: /workspace/Logs/${spring.application.name}.%d{yyyy-MM-dd}.log
      max-history: 1
      clean-history-on-start: true

#Server
server:
  port: 8761
