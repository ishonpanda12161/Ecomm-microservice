#Server
server:
  port: 8080

#Keycloak
keycloak:
  clientId: 'oauth2-ecomm-pkce'
#Gateway
gateway:
  httpclient:
    connect-timeout: 5000
    response-timeout: 10s
  ratelimit:
    replenish-rate: 100
    burst-capacity: 250
spring:
  data:
    redis:
      url: ${REDIS_URL}
#      host: localhost
#      port: 6500
  cloud:
    refresh:
      never-refreshable:
        - com.netflix.discovery.EurekaClient
        - com.netflix.discovery.DiscoveryClient
        - org.springframework.cloud.config.server.config.ConfigServerHealthIndicator
