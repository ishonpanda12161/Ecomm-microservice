#Spring
spring:
  #Oauth2 - Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_JWT_ISSUER}
          jwk-set-uri: ${KEYCLOAK_JWK_URI}
  #Database POSTGRES
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    #MessageQueue
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 30000
    virtual-host: ${RABBITMQ_VHOST}
  cloud:
    refresh:
      never-refreshable:
        - com.netflix.discovery.EurekaClient
        - com.netflix.discovery.DiscoveryClient
        - org.springframework.cloud.config.server.config.ConfigServerHealthIndicator

  #Cloud Streams ->
    stream:
      bindings:
        createOrder-out-0:
          destination: ecomm.exchange.order
          content-type: application/json
          binder: kafka
        cancelOrder-out-0:
          destination: ecomm.exchange.order
          content-type: application/json
          binder: kafka
        updateOrderStatus-out-0:
          destination: ecomm.exchange.order
          content-type: application/json
          binder: kafka
      kafka:
        binder:
          brokers: ${KAFKA_BROKER}
