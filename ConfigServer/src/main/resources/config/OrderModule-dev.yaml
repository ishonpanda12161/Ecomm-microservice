#Order : Queue and Exchange
exchange:
#  exchange:
#    name: ecomm.exchange
  key:
    created: order.created
    cancelled: order.cancelled
    delivered: order.delivered
    confirmed: order.confirmed
    shipped: order.shipped

#Logging
logging:
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n'
  level:
    root: INFO
  file:
    name: Logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: Logs/${spring.application.name}.%d{yyyy-MM-dd}.log
      max-history: 1
      clean-history-on-start: true
#Actuator + Zipkin
management:
  endpoint:
    health:
      show-details: always
      show-components: always
      circuitbreakers:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,busrefresh,refresh,prometheus,circuitbreakers
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}

#Eureka
eureka:
  client:
    refresh:
      enable: false
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    instanceId: ${spring.application.name}:${server.port}

#CircuitBreaker
resilience4j:
  circuitbreaker:
    instances:
      #Breaker for Product
      productBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-type: count_based
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

      #Breaker for User
      userBreaker:
        register-health-indicator: true
        sliding-window-size: 5
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-type: count_based
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

  retry:
    instances:
      #Retry for Product
      productRetry:
        maxAttempts: 3
        waitDuration: 500ms
        intervalFunction:
          type: exponential
          initialInterval: 500ms
          multiplier: 1.5
          maxInterval: 5s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      #Retry for User
      userRetry:
        maxAttempts: 3
        waitDuration: 500ms
        intervalFunction:
          type: exponential
          initialInterval: 500ms
          multiplier: 1.5
          maxInterval: 5s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  ratelimiter:
    instances:
      orderRate:
        timeout-duration: 0
        limit-refresh-period: 5s
        limit-for-period: 10

#Server
server:
  port: 8084
