#        binder:
#          brokers: localhost:9092
      kafka:
        binder:
          brokers: ecomm-kafka-ishon.i.aivencloud.com:13199
          jaas:
            loginModule: org.apache.kafka.common.security.scram.ScramLoginModule
            controlFlag: required
            options:
              username: "avnadmin"
              password: "AVNS_7LApTBG7qsioA-B1rW-"
