#Spring
spring:
  #Database -> MongoDB
  data:
    mongodb:
      uri: mongodb://localhost:27017/userDB
      database: userDB
  #MessageQueue
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
#Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,busrefresh,refresh

#Eureka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

#Server
server:
  port: 8082

