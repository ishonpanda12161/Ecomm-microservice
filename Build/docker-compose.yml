services:
  #Zipkin
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - backend

  #Keycloak
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8443:8080"
    command:
      - "start-dev"
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:8.0.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  config-server:
    container_name: config
    image: ishonpanda/ecomm-config
    networks:
      - backend
    ports:
      - "8888:8888"
    environment:
     EUREKA_INSTANCE_HOSTNAME: config
     RABBITMQ_HOST: ${RABBITMQ_HOST}
     RABBITMQ_PORT: ${RABBITMQ_PORT}
     RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
     RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
     RABBITMQ_VHOST: ${RABBITMQ_VHOST}
     REDIS_URL: ${REDIS_URL}
     EUREKA_URL: ${EUREKA_URL}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

  eureka-server:
    depends_on:
      - config-server
    container_name: eureka
    image: ishonpanda/ecomm-eureka
    networks:
      - backend
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      REDIS_URL: ${REDIS_URL}
      EUREKA_URL: ${EUREKA_URL}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

  notification-service:
    depends_on:
      - eureka-server
      - config-server
    container_name: notification
    image: ishonpanda/ecomm-notification
    networks:
      - backend
    ports:
      - "8085:8085"
    environment:
     #MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
     ZIPKIN_URL: ${ZIPKIN_URL}
     EUREKA_INSTANCE_HOSTNAME: notification
     SPRING_CONFIG_IMPORT: configserver:http://config:8888
     CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
     RABBITMQ_HOST: ${RABBITMQ_HOST}
     RABBITMQ_PORT: ${RABBITMQ_PORT}
     RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
     RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
     RABBITMQ_VHOST: ${RABBITMQ_VHOST}
     KAFKA_BROKER: ${KAFKA_BROKER}
     REDIS_URL: ${REDIS_URL}
     EUREKA_URL: ${EUREKA_URL}
     EMAIL_HOST: ${EMAIL_HOST}
     EMAIL_PORT: ${EMAIL_PORT}
     EMAIL_USERNAME: ${EMAIL_USERNAME}
     EMAIL_PASSWORD: ${EMAIL_PASSWORD}
     KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

  order-service:
    depends_on:
      - product-service
      - user-service
      - eureka-server
      - config-server
    container_name: order
    image: ishonpanda/ecomm-order
    networks:
      - backend
    ports:
      - "8084:8084"
    environment:
       ZIPKIN_URL: ${ZIPKIN_URL}
       EUREKA_INSTANCE_HOSTNAME: order
       SPRING_CONFIG_IMPORT: configserver:http://config:8888
       CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
       RABBITMQ_HOST: ${RABBITMQ_HOST}
       RABBITMQ_PORT: ${RABBITMQ_PORT}
       RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
       RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
       RABBITMQ_VHOST: ${RABBITMQ_VHOST}
       KAFKA_BROKER: ${KAFKA_BROKER}
       POSTGRES_USERNAME: ${POSTGRES_USERNAME}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_URL: ${POSTGRES_URL}
       REDIS_URL: ${REDIS_URL}
       EUREKA_URL: ${EUREKA_URL}
       KEYCLOAK_URI: ${KEYCLOAK_URI}
       KEYCLOAK_REALM: ${KEYCLOAK_REALM}
       KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
       KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
       KEYCLOAK_CLIENT_UID: ${KEYCLOAK_CLIENT_UID}
       KEYCLOAK_JWT_ISSUER: ${KEYCLOAK_JWT_ISSUER}
       KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

  product-service:
    depends_on:
      - eureka-server
      - config-server
    container_name: product
    image: ishonpanda/ecomm-product
    networks:
      - backend
    ports:
      - "8083:8083"
    environment:
       ZIPKIN_URL: ${ZIPKIN_URL}
       EUREKA_INSTANCE_HOSTNAME: product
       SPRING_CONFIG_IMPORT: configserver:http://config:8888
       CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
       RABBITMQ_HOST: ${RABBITMQ_HOST}
       RABBITMQ_PORT: ${RABBITMQ_PORT}
       RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
       RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
       RABBITMQ_VHOST: ${RABBITMQ_VHOST}
       KAFKA_BROKER: ${KAFKA_BROKER}
       POSTGRES_USERNAME: ${POSTGRES_USERNAME}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_URL: ${POSTGRES_URL}
       REDIS_URL: ${REDIS_URL}
       EUREKA_URL: ${EUREKA_URL}
       KEYCLOAK_URI: ${KEYCLOAK_URI}
       KEYCLOAK_REALM: ${KEYCLOAK_REALM}
       KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
       KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
       KEYCLOAK_CLIENT_UID: ${KEYCLOAK_CLIENT_UID}
       KEYCLOAK_JWT_ISSUER: ${KEYCLOAK_JWT_ISSUER}
       KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

  user-service:
    depends_on:
      - eureka-server
      - config-server
    container_name: user
    image: ishonpanda/ecomm-user
    networks:
      - backend
    ports:
      - "8082:8082"
    environment:
       ZIPKIN_URL: ${ZIPKIN_URL}
       EUREKA_INSTANCE_HOSTNAME: user
       SPRING_CONFIG_IMPORT: configserver:http://config:8888
       CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
       RABBITMQ_HOST: ${RABBITMQ_HOST}
       RABBITMQ_PORT: ${RABBITMQ_PORT}
       RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
       RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
       RABBITMQ_VHOST: ${RABBITMQ_VHOST}
       KAFKA_BROKER: ${KAFKA_BROKER}
       MONGODB_URL: ${MONGODB_URL}
       REDIS_URL: ${REDIS_URL}
       EUREKA_URL: ${EUREKA_URL}
       KEYCLOAK_URI: ${KEYCLOAK_URI}
       KEYCLOAK_REALM: ${KEYCLOAK_REALM}
       KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
       KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
       KEYCLOAK_CLIENT_UID: ${KEYCLOAK_CLIENT_UID}
       KEYCLOAK_JWT_ISSUER: ${KEYCLOAK_JWT_ISSUER}
       KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

  gateway:
    depends_on:
      - config-server
      - eureka-server
      - notification-service
      - order-service
      - product-service
      - user-service
    container_name: gateway
    image: ishonpanda/ecomm-gateway
    networks:
      - backend
    ports:
      - "8080:8080"
    environment:
       ZIPKIN_URL: ${ZIPKIN_URL}
       EUREKA_INSTANCE_HOSTNAME: gateway
       SPRING_CONFIG_IMPORT: configserver:http://config:8888
       CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
       RABBITMQ_HOST: ${RABBITMQ_HOST}
       RABBITMQ_PORT: ${RABBITMQ_PORT}
       RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
       RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
       RABBITMQ_VHOST: ${RABBITMQ_VHOST}
       REDIS_URL: ${REDIS_URL}
       EUREKA_URL: ${EUREKA_URL}
       KEYCLOAK_URI: ${KEYCLOAK_URI}
       KEYCLOAK_REALM: ${KEYCLOAK_REALM}
       KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
       KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
       KEYCLOAK_CLIENT_UID: ${KEYCLOAK_CLIENT_UID}
       KEYCLOAK_JWT_ISSUER: ${KEYCLOAK_JWT_ISSUER}
       KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
    volumes:
      - ../Logs:/workspace/Logs
    restart: unless-stopped

#PROMETHEUS-LOKI-OBSERVABILITY -----------------------------------------------
  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loki

  read:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports:
      - 3101:3100
      - 7946
      - 9095
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      loki:
        aliases:
          - loki

  write:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - 3102:3100
      - 7946
      - 9095
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./logging/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../Logs:/logs:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
    depends_on:
      - loki-gateway
    networks:
      - loki

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - loki

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki-gateway
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - loki

  backend:
    image: grafana/loki:latest
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - loki-gateway
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - loki

  loki-gateway:
    image: nginx:latest
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD", "service", "nginx", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  flog:
    image: mingrammer/flog
    command: -f json -d 200ms -l
    networks:
      - loki
#----------------------------------------------------END OBSERVABILITY--------------------------------------------------

#Volumes
volumes:
  zookeeper_data:
  kafka_data:

#Networks
networks:
  backend:
    driver: bridge
  loki:
    driver: bridge